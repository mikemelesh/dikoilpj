version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:14-alpine
    container_name: dental-lab-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dental_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dental-lab-backend
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/dental_lab
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80"]'
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -c "from app.database import engine, Base; Base.metadata.create_all(bind=engine)" &&
             alembic upgrade head &&
             python -m app.seed_data_fixed &&
             uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  # Frontend (React + Vite) - Development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: dental-lab-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # Frontend - Production (nginx)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dental-lab-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
