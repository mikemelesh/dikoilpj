<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ООО "Дикоиль плюс"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
        }

        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
            padding-top: 100px;
        }

        .auth-container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .auth-side {
            padding: 3rem;
        }

        .brand-side {
            background: #6B9FA8;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .brand-side h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .brand-side .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .brand-side p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 300px;
        }

        .form-side h2 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .form-side p {
            color: #7f8c8d;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5B9BD5;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #5B9BD5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(91, 155, 213, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
            color: #7f8c8d;
        }

        .link a {
            color: #5B9BD5;
            text-decoration: none;
            font-weight: 500;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.error {
            background: #ffe0e0;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #e0ffe0;
            color: #0c0;
            border: 1px solid #cfc;
        }

        @media (max-width: 768px) {
            .auth-container {
                grid-template-columns: 1fr;
            }

            .brand-side {
                display: none;
            }
        }
    </style>
</head>
<body>
    {% include "header.html" %}
    <div class="auth-wrapper">
    <div class="auth-container">
        <div class="brand-side">
            <div class="icon">🦷</div>
            <h1>Дикоиль плюс</h1>
            <p>Профессиональная зуботехническая лаборатория</p>
        </div>
        
        <div class="auth-side form-side">
            <h2>Вход в систему</h2>
            <p>Войдите для доступа к личному кабинету</p>
            
            <div id="alertBox" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required>
                </div>
                
                <button type="submit" class="btn" id="loginBtn">Войти</button>
            </form>
            
            <div class="link">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>
            
            <div class="link">
                <a href="/">← Вернуться на главную</a>
            </div>

            <div style="margin-top: 2rem; padding: 1rem; background: #f5f7fa; border-radius: 10px; font-size: 0.85rem;">
                <strong>Тестовые данные:</strong><br>
                Email: admin@dentallab.by<br>
                Пароль: admin123
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('role', data.role);
                    showAlert('Успешный вход! Перенаправление...', 'success');
                    setTimeout(() => {
                        window.location.href = '/cabinet';
                    }, 1000);
                } else {
                    showAlert(data.detail || 'Ошибка входа', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                }
            } catch (error) {
                showAlert('Ошибка соединения с сервером', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });
    </script>
    </div>
    </div>
</body>
</html>
