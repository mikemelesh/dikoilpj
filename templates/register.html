<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ООО "Дикоиль плюс"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
        }

        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
            padding-top: 100px;
        }

        .auth-container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 3rem;
        }

        h2 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 2rem;
            text-align: center;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-option {
            padding: 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-option:hover {
            border-color: #5B9BD5;
        }

        .role-option.active {
            border-color: #5B9BD5;
            background: #f5f7fa;
        }

        .role-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .role-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.25rem;
        }

        .role-desc {
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group label .required {
            color: #f00;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5B9BD5;
        }

        .legal-fields {
            display: none;
        }

        .legal-fields.active {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #5B9BD5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(91, 155, 213, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
            color: #7f8c8d;
        }

        .link a {
            color: #5B9BD5;
            text-decoration: none;
            font-weight: 500;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.error {
            background: #ffe0e0;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #e0ffe0;
            color: #0c0;
            border: 1px solid #cfc;
        }

        .info-box {
            background: #f5f7fa;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    {% include "header.html" %}
    <div class="auth-wrapper">
    <div class="auth-container">
        <h2>Регистрация</h2>
        <p class="subtitle">Создайте аккаунт для работы с лабораторией</p>
        
        <div id="alertBox" class="alert"></div>
        
        <form id="registerForm">
            <div class="info-box">
                Выберите тип вашего аккаунта
            </div>

            <div class="role-selector">
                <div class="role-option" data-role="individual_client" onclick="selectRole('individual_client')">
                    <div class="role-icon">👤</div>
                    <div class="role-name">Физическое лицо</div>
                    <div class="role-desc">Частный клиент</div>
                </div>
                <div class="role-option" data-role="legal_client" onclick="selectRole('legal_client')">
                    <div class="role-icon">🏢</div>
                    <div class="role-name">Юридическое лицо</div>
                    <div class="role-desc">Клиника, стоматология</div>
                </div>
            </div>

            <input type="hidden" id="role" required>

            <div class="form-group">
                <label>ФИО <span class="required">*</span></label>
                <input type="text" id="fullName" required>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Телефон <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="+375 (29) 123-45-67" required>
            </div>

            <div class="form-group">
                <label>Пароль <span class="required">*</span></label>
                <input type="password" id="password" required minlength="6">
            </div>

            <div class="form-group">
                <label>Повторите пароль <span class="required">*</span></label>
                <input type="password" id="confirmPassword" required>
            </div>

            <div class="legal-fields" id="legalFields">
                <div class="info-box">
                    Дополнительная информация для юридических лиц
                </div>

                <div class="form-group">
                    <label>Название организации <span class="required">*</span></label>
                    <input type="text" id="companyName">
                </div>

                <div class="form-group">
                    <label>УНП <span class="required">*</span></label>
                    <input type="text" id="unp" placeholder="123456789">
                </div>

                <div class="form-group">
                    <label>Юридический адрес <span class="required">*</span></label>
                    <input type="text" id="companyAddress">
                </div>
            </div>

            <button type="submit" class="btn" id="registerBtn">Зарегистрироваться</button>
        </form>
        
        <div class="link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
        
        <div class="link">
            <a href="/">← Вернуться на главную</a>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const registerBtn = document.getElementById('registerBtn');
        const legalFields = document.getElementById('legalFields');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        function selectRole(role) {
            document.querySelectorAll('.role-option').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector(`[data-role="${role}"]`).classList.add('active');
            document.getElementById('role').value = role;

            if (role === 'legal_client') {
                legalFields.classList.add('active');
                document.getElementById('companyName').required = true;
                document.getElementById('unp').required = true;
                document.getElementById('companyAddress').required = true;
            } else {
                legalFields.classList.remove('active');
                document.getElementById('companyName').required = false;
                document.getElementById('unp').required = false;
                document.getElementById('companyAddress').required = false;
            }
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const role = document.getElementById('role').value;
            if (!role) {
                showAlert('Выберите тип аккаунта', 'error');
                return;
            }

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Пароли не совпадают', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Пароль должен быть не менее 6 символов', 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Регистрация...';

            const userData = {
                email: document.getElementById('email').value,
                password: password,
                full_name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                role: role
            };

            if (role === 'legal_client') {
                userData.company_name = document.getElementById('companyName').value;
                userData.unp = document.getElementById('unp').value;
                userData.company_address = document.getElementById('companyAddress').value;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('role', data.role);
                    showAlert('Регистрация успешна! Перенаправление...', 'success');
                    setTimeout(() => {
                        window.location.href = '/cabinet';
                    }, 1500);
                } else {
                    showAlert(data.detail || 'Ошибка регистрации', 'error');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Зарегистрироваться';
                }
            } catch (error) {
                showAlert('Ошибка соединения с сервером', 'error');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Зарегистрироваться';
            }
        });
    </script>
    </div>
    </div>
</body>
</html>
