<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Услуги - ООО "Дикоиль плюс"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            color: #2c3e50;
            line-height: 1.6;
        }


        .page-header {
            background: #6B9FA8;
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .filters {
            background: #f5f7fa;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #2c3e50;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #5B9BD5;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
            align-items: stretch;
        }

        .service-card {
            background: #f5f7fa;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .service-category {
            display: inline-block;
            background: #6B9FA8;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .service-card p {
            color: #7f8c8d;
            margin-bottom: 1rem;
            flex-grow: 1;
            display: -webkit-box;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
            min-height: 4.5em;
        }

        .service-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-label {
            color: #7f8c8d;
            font-weight: 500;
        }

        .detail-value {
            color: #2c3e50;
            font-weight: 600;
        }

        .price {
            font-size: 2rem;
            font-weight: bold;
            color: #5B9BD5;
            margin: 1rem 0;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #5B9BD5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(91, 155, 213, 0.4);
        }

        .calculator {
            background: #f5f7fa;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .calculator h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #2c3e50;
        }

        .calc-grid {
            display: grid;
            gap: 1rem;
        }

        .calc-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 10px;
        }

        .calc-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .calc-item-info {
            flex: 1;
        }

        .calc-item-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .calc-item-price {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .calc-item input[type="number"] {
            width: 80px;
            padding: 0.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
        }

        .calc-total {
            background: #6B9FA8;
            color: white;
            padding: 2rem;
            border-radius: 15px;
            margin-top: 2rem;
            text-align: center;
        }

        .calc-total h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .calc-total-price {
            font-size: 3rem;
            font-weight: bold;
        }

        .calc-note {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #7f8c8d;
        }
    </style>
</head>
{% include "header.html" %}
<body>

    <div class="page-header">
        <h1>Наши услуги</h1>
        <p>Полный спектр зуботехнических услуг</p>
    </div>

    <div class="container">
        <div class="calculator">
            <h2>Расчет стоимости</h2>
            <p style="text-align: center; color: #7f8c8d; margin-bottom: 1.5rem; font-size: 0.95rem;">Выберите услуги и количество</p>
            <div class="calc-grid" id="calculatorItems"></div>
            <div class="calc-total">
                <h3>Итого</h3>
                <div class="calc-total-price" id="totalPrice">0 BYN</div>
                <p class="calc-note">Ориентировочная цена, точная стоимость уточняется при заказе</p>
                <button class="btn" style="margin-top: 1rem; background: white; color: #5B9BD5;" onclick="submitOrder()">Оформить заказ</button>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Категория</label>
                <select id="categoryFilter">
                    <option value="">Все</option>
                    <option value="Коронки">Коронки</option>
                    <option value="Протезы">Протезы</option>
                    <option value="Виниры">Виниры</option>
                    <option value="Вкладки">Вкладки</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Материал</label>
                <select id="materialFilter">
                    <option value="">Все</option>
                    <option value="Металлокерамика">Металлокерамика</option>
                    <option value="Диоксид циркония">Диоксид циркония</option>
                    <option value="Керамика">Керамика</option>
                    <option value="Пластмасса">Пластмасса</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Поиск</label>
                <input type="text" id="searchInput" placeholder="Название услуги...">
            </div>
        </div>

        <h2 style="font-size: 2rem; margin-bottom: 2rem; text-align: center;">Каталог услуг</h2>
        <div class="services-grid" id="servicesGrid">
            <div class="loading">Загрузка услуг...</div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 ООО "Дикоиль плюс". Все права защищены.</p>
    </footer>

    <script>
        let services = [];
        let selectedServices = new Map();

        async function loadServices() {
            try {
                const response = await fetch('/api/services');
                services = await response.json();
                renderServices();
                renderCalculator();
            } catch (error) {
                document.getElementById('servicesGrid').innerHTML = '<div class="loading">Ошибка загрузки услуг</div>';
            }
        }

        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            const category = document.getElementById('categoryFilter').value;
            const material = document.getElementById('materialFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = services.filter(s => {
                if (category && s.category !== category) return false;
                if (material && s.material !== material) return false;
                if (search && !s.name.toLowerCase().includes(search)) return false;
                return s.is_active;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading">Услуги не найдены</div>';
                return;
            }

            grid.innerHTML = filtered.map(service => `
                <div class="service-card">
                    <span class="service-category">${service.category}</span>
                    <h3>${service.name}</h3>
                    <p>${service.description}</p>
                    <div class="service-details">
                        <div class="detail-row">
                            <span class="detail-label">Материал:</span>
                            <span class="detail-value">${service.material}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Срок:</span>
                            <span class="detail-value">${service.production_time_days} дней</span>
                        </div>
                    </div>
                    <div class="price">${service.base_price} BYN</div>
                    <div style="margin-top: auto;">
                        <button class="btn" onclick="addToCalculator(${service.id})">В расчет</button>
                        <a href="/service/${service.id}" style="display: block; margin-top: 0.5rem; text-align: center; color: #5B9BD5; text-decoration: none; font-size: 0.9rem;">Подробнее →</a>
                    </div>
                </div>
            `).join('');
        }

        function renderCalculator() {
            const container = document.getElementById('calculatorItems');
            container.innerHTML = services.filter(s => s.is_active).map(service => `
                <div class="calc-item">
                    <input type="checkbox" id="calc-${service.id}" onchange="toggleService(${service.id})">
                    <div class="calc-item-info">
                        <div class="calc-item-name">${service.name}</div>
                        <div class="calc-item-price">${service.base_price} BYN / шт</div>
                    </div>
                    <input type="number" id="qty-${service.id}" min="1" value="1" onchange="updateQuantity(${service.id}, this.value)" disabled>
                </div>
            `).join('');
        }

        function addToCalculator(serviceId) {
            const checkbox = document.getElementById(`calc-${serviceId}`);
            checkbox.checked = true;
            toggleService(serviceId);
            window.scrollTo({ top: document.querySelector('.calculator').offsetTop - 100, behavior: 'smooth' });
        }

        function toggleService(serviceId) {
            const checkbox = document.getElementById(`calc-${serviceId}`);
            const qtyInput = document.getElementById(`qty-${serviceId}`);
            
            if (checkbox.checked) {
                qtyInput.disabled = false;
                const service = services.find(s => s.id === serviceId);
                selectedServices.set(serviceId, { service, quantity: 1 });
            } else {
                qtyInput.disabled = true;
                selectedServices.delete(serviceId);
            }
            
            calculateTotal();
        }

        function updateQuantity(serviceId, quantity) {
            const qty = parseInt(quantity) || 1;
            const item = selectedServices.get(serviceId);
            if (item) {
                item.quantity = qty;
                calculateTotal();
            }
        }

        function calculateTotal() {
            let total = 0;
            selectedServices.forEach(({ service, quantity }) => {
                total += service.base_price * quantity;
            });
            document.getElementById('totalPrice').textContent = `${total.toFixed(2)} BYN`;
        }

        function submitOrder() {
            if (selectedServices.size === 0) {
                alert('Выберите хотя бы одну услугу');
                return;
            }
            
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Пожалуйста, войдите в систему для оформления заказа');
                window.location.href = '/login';
                return;
            }

            alert('Функция оформления заказа будет доступна в личном кабинете');
            window.location.href = '/cabinet';
        }

        document.getElementById('categoryFilter').addEventListener('change', renderServices);
        document.getElementById('materialFilter').addEventListener('change', renderServices);
        document.getElementById('searchInput').addEventListener('input', renderServices);

        loadServices();
    </script>
</body>
</html>
